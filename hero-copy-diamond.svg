<svg xmlns="http://www.w3.org/2000/svg" width="500" height="330" viewBox="0 0 500 330" role="img" aria-labelledby="title desc">
  <title id="title">Jim Lau introduction</title>
  <desc id="desc">Jim Lau is a game composer who has worked on TGA award-winning projects.</desc>
  <g transform="skewX(-6)" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#a7a7a7" text-anchor="middle">
    <text x="250" y="25"><tspan fill="#22ef00">Jim Lau</tspan><tspan> is a</tspan></text>
    <text x="250" y="48">game composer who has</text>
    <text x="250" y="71"><tspan>worked on </tspan><tspan fill="#f000df">TGA</tspan><tspan> award-winning projects. He</tspan></text>
    <text x="250" y="94">is a level music designer, jazz pianist, and</text>
    <text x="250" y="117">educator.</text>
    <text x="250" y="160"><tspan>A graduate of </tspan><tspan fill="#f000df">Hamburg Konservatorium</tspan><tspan>, he</tspan></text>
    <text x="250" y="183">now blends jazz, classical, and hybrid game</text>
    <text x="250" y="206">music, with design experience spanning</text>
    <text x="250" y="229">performance, level flow, and combat. His</text>
    <text x="250" y="252"><tspan>main project is </tspan><tspan fill="#f000df">Wuthering Waves</tspan><tspan>.</tspan></text>
  </g>
</svg>
